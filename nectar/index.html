<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nectar — BeatLab</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080d;
      --surface: #0f1117;
      --surface-2: #161820;
      --border: rgba(255,160,60,0.15);
      --root-color: #ff9d3d;
      --scale-color: #e8e8e8;
      --active-color: #ffcf6b;
      --text: #d8d4c8;
      --text-muted: #7a7060;
      --font: 'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #top-bar {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .home-link {
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--root-color);
      opacity: 0.6;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .home-link:hover { opacity: 1; }

    .topbar-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    .wordmark {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--root-color);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nectar-tab {
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s;
    }
    .nectar-tab:hover { color: var(--text); }
    .nectar-tab.active { color: var(--root-color); border-bottom-color: var(--root-color); }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .vol-label { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    #vol-slider {
      -webkit-appearance: none; appearance: none;
      width: 70px; height: 3px; background: rgba(255,160,60,0.2); border-radius: 999px; outline: none; cursor: pointer;
    }
    #vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--root-color); cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      min-width: 0;
    }

    .controls select,
    .controls input[type="number"],
    .controls button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: var(--font);
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    .controls select:hover,
    .controls input[type="number"]:hover,
    .controls button:hover {
      border-color: var(--root-color);
    }

    .controls select:focus,
    .controls input[type="number"]:focus {
      border-color: var(--root-color);
    }

    .controls input[type="number"] {
      width: 64px;
      text-align: center;
    }

    /* Remove spinner arrows from number input */
    .controls input[type="number"]::-webkit-inner-spin-button,
    .controls input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    #play-btn {
      min-width: 84px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    #play-btn.playing {
      background: var(--root-color);
      color: #07080d;
      border-color: var(--root-color);
    }

    .bpm-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: default;
    }

    .bpm-label input {
      cursor: text;
    }

    .box-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .box-label input[type="checkbox"] {
      accent-color: var(--root-color);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    #fretboard-container {
      flex-shrink: 0;
      background: #1a1208;
    }

    #mood-card {
      flex: 1;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
    }

    #mood-card .legend {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    #mood-card .legend span { display: flex; align-items: center; gap: 5px; }
    #mood-card .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #mood-card .legend .dot-root  { background: var(--root-color); box-shadow: 0 0 6px var(--root-color); }
    #mood-card .legend .dot-scale { background: var(--scale-color); box-shadow: 0 0 4px rgba(255,255,255,0.3); }

    .mood-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .mood-feel {
      font-size: 0.85rem;
      color: var(--root-color);
    }

    .mood-genre {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .mood-examples {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .mood-tip {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 2px solid var(--border);
      padding-left: 10px;
      margin-top: 2px;
    }

    #identify-link {
      margin-left: auto;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: color 0.15s;
    }

    #identify-link:hover { color: var(--root-color); }

    #chords-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: color 0.15s;
    }

    #chords-link:hover {
      color: var(--root-color);
    }

    /* Select option styling */
    option {
      background: var(--surface-2);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <a href="index.html" class="nectar-tab active">Scales</a>
      <a href="chords.html" class="nectar-tab">Chords</a>
      <a href="identify.html" class="nectar-tab">Identify</a>
      <a href="licks.html" class="nectar-tab">Licks</a>
      <div class="topbar-divider"></div>
      <select id="root-select"></select>
      <select id="scale-select"></select>
      <button id="play-btn">&#9654; Play</button>
      <label class="bpm-label"><span>BPM</span><input id="bpm-input" type="number" min="40" max="200" value="80"></label>
      <label class="box-label"><input id="box-check" type="checkbox"><span>Box</span></label>
      <div class="topbar-right">
        <select id="tone-select"></select>
        <span class="vol-label">Vol</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </header>
    <div id="fretboard-container"></div>
    <div id="mood-card">
      <div class="legend">
        <span><span class="dot dot-root"></span>Root note</span>
        <span><span class="dot dot-scale"></span>Scale note</span>
      </div>
      <div class="mood-name" id="mood-name"></div>
      <div class="mood-feel" id="mood-feel"></div>
      <div class="mood-genre" id="mood-genre"></div>
      <div class="mood-examples" id="mood-examples"></div>
      <div class="mood-tip" id="mood-tip"></div>
    </div>
  </div>

  <script type="module">
    // Scales: scale explorer on the shared Nectar neck + synth (see nectar/shared/).
    import { SCALES, NOTE_NAMES, ROOT_MIDI, STRINGS, OPEN_MIDI, FRET_COUNT, midiAt, degree, positionsInScale } from './shared/theory.js';
    import { setupAudio } from './shared/audio-ui.js';
    import { Player } from './shared/player.js';
    import { Neck, ghostDots } from './shared/neck.js';

    let currentScale = 'minor-pentatonic';
    let currentRoot  = 69; // A
    let boxMode      = false;

    const synth  = setupAudio();
    const player = new Player(synth);
    const playBtn = document.getElementById('play-btn');
    let clearTimer = null;

    const neck = new Neck(document.getElementById('fretboard-container'), {
      frets: FRET_COUNT,
      interaction: 'strum',
      onPluck: (note) => {
        synth.audition([note]);
        showActive(note, 800);
      },
    });

    // Highlight a note (gold + ring); optionally clear it after `ms`.
    function showActive(note, ms = 0) {
      neck.setActive([note]);
      neck.flash(note);
      clearTimeout(clearTimer);
      if (ms) clearTimer = setTimeout(() => neck.setActive([]), ms);
    }

    // 4-fret hand position anchored on the root's fret on the low E string.
    function getBoxRange() {
      const rootFret = degree(currentRoot, OPEN_MIDI[6]);
      const boxMin = Math.max(rootFret + (SCALES[currentScale].boxOffset || 0), 0);
      return [boxMin, Math.min(boxMin + 3, FRET_COUNT)];
    }

    function renderNeck() {
      const intervals = SCALES[currentScale].intervals;
      const [lo, hi] = getBoxRange();
      const inScale = positionsInScale(currentRoot, intervals);
      const scaleKeys = new Set(inScale.map((p) => `${p.string}:${p.fret}`));
      neck.setLayer('ghost', ghostDots().filter((d) => !scaleKeys.has(`${d.string}:${d.fret}`)));
      neck.setLayer('scale', inScale.map((p) => {
        const root = p.degree === 0;
        return {
          ...p,
          size: root ? 'md' : 'sm',
          fill: root ? '#ff9d3d' : '#e8e8e8',
          glow: root,
          opacity: boxMode && (p.fret < lo || p.fret > hi) ? 0.12 : 1,
        };
      }));
    }

    // Notes for the Play run, low to high.
    function runNotes() {
      const intervals = SCALES[currentScale].intervals;
      const lowToHigh = [...STRINGS].reverse();
      const notes = [];
      if (boxMode) {
        // Every scale note inside the box.
        const [lo, hi] = getBoxRange();
        for (const string of lowToHigh) for (let fret = lo; fret <= hi; fret++) {
          if (intervals.includes(degree(midiAt(string, fret), currentRoot))) notes.push({ string, fret });
        }
      } else {
        // One occurrence per pitch across frets 0-12, lowest string preferred.
        const seen = new Set();
        for (const string of lowToHigh) for (let fret = 0; fret <= 12; fret++) {
          const midi = midiAt(string, fret);
          if (intervals.includes(degree(midi, currentRoot)) && !seen.has(midi)) {
            seen.add(midi);
            notes.push({ string, fret });
          }
        }
      }
      return notes.sort((a, b) => midiAt(a.string, a.fret) - midiAt(b.string, b.fret));
    }

    function updateMoodCard() {
      const s = SCALES[currentScale];
      document.getElementById('mood-name').textContent     = s.name;
      document.getElementById('mood-feel').textContent     = s.feel;
      document.getElementById('mood-genre').textContent    = s.genre;
      document.getElementById('mood-examples').textContent = s.examples;
      document.getElementById('mood-tip').textContent      = s.tip || '';
    }

    function renderAll() {
      renderNeck();
      updateMoodCard();
    }

    function setPlayButton(playing) {
      playBtn.innerHTML = playing ? '&#9632; Stop' : '&#9654; Play';
      playBtn.classList.toggle('playing', playing);
    }

    // ---- Play: ascending then descending run, eighth notes
    let runSong = null;
    player.onEvent = (i) => showActive(runSong.events[i].notes[0]);
    player.onStop = () => {
      setPlayButton(false);
      neck.setActive([]);
    };

    playBtn.addEventListener('click', () => {
      if (player.playing) { player.stop(); return; }
      const notes = runNotes();
      const seq = [...notes, ...notes.slice().reverse().slice(1)];
      runSong = {
        events: seq.map((n, i) => ({ beat: i * 0.5, dur: 0.5, notes: [n] })),
        loopBeats: seq.length * 0.5,
        swing: false,
      };
      player.load(runSong);
      const bpm = parseInt(document.getElementById('bpm-input').value) || 80;
      player.start({ bpm, loop: false, countIn: false, metronome: false });
      setPlayButton(true);
    });

    // ---- Controls
    const scaleSelect = document.getElementById('scale-select');
    Object.entries(SCALES).forEach(([key, s]) => {
      scaleSelect.appendChild(new Option(s.name, key, false, key === currentScale));
    });

    const rootSelect = document.getElementById('root-select');
    NOTE_NAMES.forEach((name, i) => {
      rootSelect.appendChild(new Option(name, i, false, ROOT_MIDI[i] === currentRoot));
    });

    function setRoot(i) {
      player.stop();
      rootSelect.value = i;
      currentRoot = ROOT_MIDI[i];
      renderAll();
    }

    scaleSelect.addEventListener('change', (e) => {
      player.stop();
      currentScale = e.target.value;
      renderAll();
    });
    rootSelect.addEventListener('change', (e) => setRoot(parseInt(e.target.value)));
    document.getElementById('box-check').addEventListener('change', (e) => {
      boxMode = e.target.checked;
      renderAll();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
      if (e.code === 'ArrowRight') setRoot((ROOT_MIDI.indexOf(currentRoot) + 1) % 12);
      if (e.code === 'ArrowLeft') setRoot((ROOT_MIDI.indexOf(currentRoot) + 11) % 12);
    });

    renderAll();
  </script>

  <style>
    #rotate-prompt {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #07080d;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #6a7a8a;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
    }
    #rotate-prompt svg { opacity: 0.5; animation: rotate-hint 2s ease-in-out infinite; }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-prompt { display: flex; }
    }
    body.is-touch.is-portrait #rotate-prompt { display: flex; }
  </style>
  <script>
    (function() {
      var isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
      if (isTouch) {
        document.body.classList.add('is-touch');
        function checkOrientation() {
          document.body.classList.toggle('is-portrait', window.innerHeight > window.innerWidth);
        }
        checkOrientation();
        window.addEventListener('resize', checkOrientation);
      }
    })();
  </script>
  <div id="rotate-prompt">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
    </svg>
    <p>Rotate for best experience</p>
  </div>

<script type="module">
import { initTopnav } from '../core/topnav.js';
initTopnav({ current: 'nectar', root: '../', label: 'Nectar' });
</script>
</body>
</html>
