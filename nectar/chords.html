<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nectar — BeatLab</title>
  <link rel="icon" type="image/png" href="../icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080d;
      --surface: #0f1117;
      --surface-2: #161820;
      --border: rgba(255,160,60,0.15);
      --root-color: #ff9d3d;
      --scale-color: #e8e8e8;
      --active-color: #ffcf6b;
      --text: #d8d4c8;
      --text-muted: #7a7060;
      --font: 'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #top-bar {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      flex-shrink: 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .home-link {
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--root-color);
      opacity: 0.6;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .home-link:hover { opacity: 1; }

    .topbar-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    .wordmark {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--root-color);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nectar-tab {
      font-family: var(--font);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.12s, border-color 0.12s;
    }
    .nectar-tab:hover { color: var(--text); }
    .nectar-tab.active { color: var(--root-color); border-bottom-color: var(--root-color); }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .vol-label { font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    #vol-slider {
      -webkit-appearance: none; appearance: none;
      width: 70px; height: 3px; background: rgba(255,160,60,0.2); border-radius: 999px; outline: none; cursor: pointer;
    }
    #vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: var(--root-color); cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .controls select {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: var(--font);
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    .controls select:hover,
    .controls select:focus {
      border-color: var(--root-color);
    }

    .voicing-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .voicing-btn {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      padding: 6px 14px;
      font-family: var(--font);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      outline: none;
    }

    .voicing-btn:first-child {
      border-right: 1px solid var(--border);
    }

    .voicing-btn.active {
      background: var(--root-color);
      color: #07080d;
      font-weight: 600;
    }

    .voicing-btn:not(.active):hover {
      border-color: var(--root-color);
      color: var(--root-color);
    }

    #play-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 16px;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      letter-spacing: 0.03em;
    }

    #play-btn:hover {
      border-color: var(--root-color);
    }

    #play-btn.playing {
      background: var(--root-color);
      color: #07080d;
      border-color: var(--root-color);
    }

    #identify-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      transition: color 0.15s;
    }

    #identify-link:hover { color: var(--root-color); }

    /* Select option styling */
    option {
      background: var(--surface-2);
      color: var(--text);
    }

    #fretboard-container {
      flex-shrink: 0;
      background: #1a1208;
    }

    #chord-card {
      flex: 1;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    #chord-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
    }

    #chord-intervals {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .interval-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      min-width: 52px;
      gap: 2px;
    }

    .interval-chip .note-name {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .interval-chip .int-name {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    #chord-theory {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-left: 2px solid var(--border);
      padding-left: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <a href="index.html" class="nectar-tab">Scales</a>
      <a href="chords.html" class="nectar-tab active">Chords</a>
      <a href="identify.html" class="nectar-tab">Identify</a>
      <a href="licks.html" class="nectar-tab">Licks</a>
      <div class="topbar-divider"></div>
      <div class="controls">
        <select id="root-select"></select>
        <select id="chord-select"></select>
        <div class="voicing-toggle">
          <button class="voicing-btn active" id="btn-e">E-shape</button>
          <button class="voicing-btn" id="btn-a">A-shape</button>
        </div>
        <button id="play-btn">&#9654; Play</button>
      </div>
      <div class="topbar-right">
        <select id="instrument-select"></select>
        <select id="tuning-select"></select>
        <select id="tone-select"></select>
        <span class="vol-label">Vol</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </header>
    <div id="fretboard-container"></div>
    <div id="chord-card">
      <div id="chord-title"></div>
      <div id="chord-intervals"></div>
      <div id="chord-theory"></div>
    </div>
  </div>

  <script type="module">
    // Chords: chord explorer on the shared Nectar neck + synth (see nectar/shared/).
    import { NOTE_NAMES, ROOT_MIDI, OPEN_MIDI, STRING_NAMES, INSTRUMENT, TUNING, FRET_COUNT, INTERVAL_COLORS, midiAt, degree, positionsInScale, stringsLowToHigh, onTuningChange } from './shared/theory.js';
    import { setupAudio } from './shared/audio-ui.js';
    import { setupInstrument } from './shared/instrument-ui.js';
    import { Neck, ghostDots } from './shared/neck.js';

    // ─── Chord Data ───────────────────────────────────────────────────────────

    const INTERVAL_LABELS = {
      0: 'R', 2: '9', 3: 'm3', 4: '3', 5: '4',
      6: '♭5', 7: '5', 8: '♯5', 9: '°7', 10: '♭7', 11: '7', 14: '9',
    };

    const INTERVAL_NAMES = {
      0: 'Root', 2: 'Maj 2nd', 3: 'Min 3rd', 4: 'Maj 3rd', 5: 'Perf 4th',
      6: 'Dim 5th', 7: 'Perf 5th', 8: 'Aug 5th', 9: 'Dim 7th',
      10: 'Min 7th', 11: 'Maj 7th', 14: 'Maj 9th',
    };

    const CHORDS = {
      'major': {
        name: 'Major', symbol: '',
        intervals: [0, 4, 7],
        theory: 'The major third (4 semitones up from root) is the single note that makes this chord sound bright and happy. Lower it by one semitone and you get a minor chord.',
      },
      'minor': {
        name: 'Minor', symbol: 'm',
        intervals: [0, 3, 7],
        theory: 'The minor third (3 semitones) — just one semitone lower than the major third — is the entire reason this chord sounds darker and more melancholic.',
      },
      'dom7': {
        name: 'Dominant 7th', symbol: '7',
        intervals: [0, 4, 7, 10],
        theory: 'Major triad plus a minor 7th. The interval between the major 3rd and minor 7th is a tritone — maximum tension that strongly wants to resolve a 4th upward.',
      },
      'maj7': {
        name: 'Major 7th', symbol: 'maj7',
        intervals: [0, 4, 7, 11],
        theory: 'The major 7th sits just a semitone below the octave. It adds a dreamy, sophisticated colour — less tense than the dominant 7th, more like a colour note.',
      },
      'min7': {
        name: 'Minor 7th', symbol: 'm7',
        intervals: [0, 3, 7, 10],
        theory: 'Minor triad with a minor 7th. Smoother than the dominant 7th — less tension, more colour. The foundation of jazz and R&B harmony.',
      },
      'sus2': {
        name: 'Suspended 2nd', symbol: 'sus2',
        intervals: [0, 2, 7],
        theory: 'No third at all — the 2nd replaces it. Neither major nor minor, which gives it an open, ambiguous quality. Often resolves to the major or minor.',
      },
      'sus4': {
        name: 'Suspended 4th', symbol: 'sus4',
        intervals: [0, 5, 7],
        theory: 'The 4th replaces the 3rd — creates tension that wants to resolve down to the major third. Very common as a passing chord or for rhythmic colour.',
      },
      'dim': {
        name: 'Diminished', symbol: 'dim',
        intervals: [0, 3, 6],
        theory: 'Two minor thirds stacked on top of each other. The diminished fifth (tritone) creates maximum instability — strong gravitational pull to resolve.',
      },
      'dim7': {
        name: 'Diminished 7th', symbol: '°7',
        intervals: [0, 3, 6, 9],
        theory: 'Four minor thirds stacked — perfectly symmetric. The chord sounds identical from any of its four notes. Maximum tension and drama.',
      },
      'aug': {
        name: 'Augmented', symbol: '+',
        intervals: [0, 4, 8],
        theory: 'Two major thirds stacked. The augmented fifth (one semitone above a perfect fifth) creates an eerie, unresolved quality. Symmetric like diminished.',
      },
    };

    // ─── Voicing Computation ──────────────────────────────────────────────────

    // shape 0 = root on the lowest string (E-shape in standard), 1 = root on the next one up
    // (A-shape; strings below it muted). Returns one entry per string, lowest first:
    // { string, fret, interval } or { string, muted: true }.
    function computeVoicing(chordKey, rootMidi, shape) {
      const { intervals } = CHORDS[chordKey];
      const anchor = stringsLowToHigh()[shape];
      const rootFret = degree(rootMidi, OPEN_MIDI[anchor]);
      const voicing = [];
      for (const string of stringsLowToHigh()) {
        if (OPEN_MIDI[string] < OPEN_MIDI[anchor]) { voicing.push({ string, muted: true }); continue; }
        let found = null;
        for (let fret = rootFret; fret <= Math.min(rootFret + 4, FRET_COUNT); fret++) {
          const interval = degree(midiAt(string, fret), rootMidi);
          if (intervals.includes(interval)) { found = { string, fret, interval }; break; }
        }
        voicing.push(found || { string, muted: true });
      }
      return voicing;
    }

    // ─── Chord Card ───────────────────────────────────────────────────────────

    function updateChordCard(chordKey, rootMidi) {
      const chord = CHORDS[chordKey];
      const rootName = NOTE_NAMES[rootMidi % 12];
      const symbol = chord.symbol;
      document.getElementById('chord-title').textContent = symbol
        ? `${rootName}${symbol} — ${rootName} ${chord.name}`
        : `${rootName} — ${rootName} ${chord.name}`;
      document.getElementById('chord-theory').textContent = chord.theory;

      const container = document.getElementById('chord-intervals');
      container.innerHTML = '';
      for (const interval of chord.intervals) {
        const color = INTERVAL_COLORS[interval] || '#fff';
        const chip = document.createElement('div');
        chip.className = 'interval-chip';
        chip.style.borderColor = color + '55';
        const noteEl = document.createElement('div');
        noteEl.className = 'note-name';
        noteEl.style.color = color;
        noteEl.textContent = NOTE_NAMES[(rootMidi + interval) % 12];
        const nameEl = document.createElement('div');
        nameEl.className = 'int-name';
        nameEl.textContent = INTERVAL_NAMES[interval] || '';
        chip.appendChild(noteEl);
        chip.appendChild(nameEl);
        container.appendChild(chip);
      }
    }

    // ─── UI ───────────────────────────────────────────────────────────────────

    let currentChord = 'major';
    let currentRoot  = 69; // A
    let shape        = 0;  // 0 = E-shape, 1 = A-shape (see computeVoicing)

    const synth = setupAudio();
    const neck = new Neck(document.getElementById('fretboard-container'), {
      interaction: 'strum',
      onPluck: (note) => {
        synth.audition([note]);
        neck.flash(note);
      },
    });

    function rerender() {
      const { intervals } = CHORDS[currentChord];
      const voicing = computeVoicing(currentChord, currentRoot, shape);
      const voiced = new Set(voicing.filter((v) => !v.muted).map((v) => `${v.string}:${v.fret}`));
      const tones = positionsInScale(currentRoot, intervals);
      const toneKeys = new Set(tones.map((t) => `${t.string}:${t.fret}`));

      const muted = voicing.filter((v) => v.muted).map((v) => v.string);
      neck.setLayer('ghost', ghostDots(neck.frets, 0.12).filter((d) =>
        !toneKeys.has(`${d.string}:${d.fret}`) && !(d.fret === 0 && muted.includes(d.string))));
      // Every chord tone across the neck: small and dim, labelled by interval.
      // (On muted strings the open position shows only the X.)
      neck.setLayer('scale', tones.filter((t) => !voiced.has(`${t.string}:${t.fret}`) && !(t.fret === 0 && muted.includes(t.string))).map((t) => ({
        ...t, size: 'sm', fill: INTERVAL_COLORS[t.degree] || '#fff', opacity: 0.4,
        label: INTERVAL_LABELS[t.degree] || '', labelColor: '#fff', labelSize: 7,
      })));
      // The voicing itself: large, bright, glowing.
      neck.setLayer('main', voicing.filter((v) => !v.muted).map((v) => ({
        ...v, size: 12, fill: INTERVAL_COLORS[v.interval] || '#fff', glow: true, label: INTERVAL_LABELS[v.interval] || '',
      })));
      neck.setMuted(muted);
      updateChordCard(currentChord, currentRoot);
    }

    const rootSelect = document.getElementById('root-select');
    NOTE_NAMES.forEach((name, i) => rootSelect.appendChild(new Option(name, i, false, ROOT_MIDI[i] === currentRoot)));

    const chordSelect = document.getElementById('chord-select');
    Object.entries(CHORDS).forEach(([key, c]) => chordSelect.appendChild(new Option(c.name, key, false, key === currentChord)));

    const btnE = document.getElementById('btn-e');
    const btnA = document.getElementById('btn-a');
    function setShape(sh) {
      shape = sh;
      btnE.classList.toggle('active', sh === 0);
      btnA.classList.toggle('active', sh === 1);
      rerender();
    }
    btnE.addEventListener('click', () => setShape(0));
    btnA.addEventListener('click', () => setShape(1));

    // "E-shape"/"A-shape" only mean something on a standard-tuned guitar.
    function labelShapes() {
      const [low, next] = stringsLowToHigh();
      const standardGuitar = INSTRUMENT.id === 'guitar' && TUNING.id === 'standard';
      btnE.textContent = standardGuitar ? 'E-shape' : `Root on ${STRING_NAMES[low]}`;
      btnA.textContent = standardGuitar ? 'A-shape' : `Root on ${STRING_NAMES[next]}`;
    }

    function setRoot(i) {
      rootSelect.value = i;
      currentRoot = ROOT_MIDI[i];
      rerender();
    }
    rootSelect.addEventListener('change', (e) => setRoot(parseInt(e.target.value)));
    chordSelect.addEventListener('change', (e) => { currentChord = e.target.value; rerender(); });

    // Down-strum: voiced notes low E → high e, 60ms apart.
    const playBtn = document.getElementById('play-btn');
    function playChord() {
      const notes = computeVoicing(currentChord, currentRoot, shape).filter((v) => !v.muted);
      const delays = synth.audition(notes, 0.06);
      playBtn.classList.add('playing');
      notes.forEach((n, i) => setTimeout(() => neck.flash(n), delays[i]));
      setTimeout(() => playBtn.classList.remove('playing'), delays[delays.length - 1] + 400);
    }
    playBtn.addEventListener('click', playChord);

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); playChord(); return; }
      if (e.code === 'ArrowRight') setRoot((ROOT_MIDI.indexOf(currentRoot) + 1) % 12);
      if (e.code === 'ArrowLeft') setRoot((ROOT_MIDI.indexOf(currentRoot) + 11) % 12);
    });

    setupInstrument();
    onTuningChange(() => { labelShapes(); rerender(); });
    labelShapes();
    rerender();
  </script>

  <style>
    #rotate-prompt {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #07080d;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #6a7a8a;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
    }
    #rotate-prompt svg { opacity: 0.5; animation: rotate-hint 2s ease-in-out infinite; }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    @media (pointer: coarse) and (orientation: portrait) {
      #rotate-prompt { display: flex; }
    }
    body.is-touch.is-portrait #rotate-prompt { display: flex; }
  </style>
  <script>
    (function() {
      var isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
      if (isTouch) {
        document.body.classList.add('is-touch');
        function checkOrientation() {
          document.body.classList.toggle('is-portrait', window.innerHeight > window.innerWidth);
        }
        checkOrientation();
        window.addEventListener('resize', checkOrientation);
      }
    })();
  </script>
  <div id="rotate-prompt">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M12 18h.01"/>
    </svg>
    <p>Rotate for best experience</p>
  </div>

<script type="module">
import { initTopnav } from '../core/topnav.js';
initTopnav({ current: 'nectar', root: '../', label: 'Nectar' });
</script>
</body>
</html>
