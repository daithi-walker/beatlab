# Serves the whole repo (every app + core/) on one port for local development.
#   docker compose up -d   →   http://localhost:8765
# The per-app compose files (nectar/, multibank/, synth/) still work and serve the same tree.
services:
  beatlab:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8765:80"   # this machine only: the saved-tabs folder accepts writes
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nectar/my-tabs:/usr/share/nginx/html/nectar/my-tabs   # writable: Tab editor saves here
