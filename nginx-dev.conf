# Local dev server config shared by every app's docker-compose.yml.
# no-cache = the browser revalidates every file on each load (cheap 304s), so a plain
# refresh always picks up edited JS modules instead of a stale cached copy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
}
