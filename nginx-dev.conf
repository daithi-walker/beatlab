# Local dev server config shared by every app's docker-compose.yml.
# no-cache = the browser revalidates every file on each load (cheap 304s), so a plain
# refresh always picks up edited JS modules instead of a stale cached copy.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";

    # Nectar's saved tabs (git-ignored): listed as JSON, saved with PUT, removed with
    # DELETE. Local only; the compose files bind the port to 127.0.0.1 and mount this
    # folder writable.
    location /nectar/my-tabs/ {
        autoindex on;
        autoindex_format json;
        dav_methods PUT DELETE;
        client_max_body_size 2m;
        add_header Cache-Control "no-store";
    }
}
